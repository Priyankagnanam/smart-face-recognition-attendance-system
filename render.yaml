services:
  - type: web
    name: smart-face-attendance
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: BEHIND_PROXY
        value: "1"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
