{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div style="text-align: center; padding: 80px 20px;">
    <div style="font-size: 80px; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">404</div>
    <div style="font-size: 24px; font-weight: 600; margin-top: 16px;">Page Not Found</div>
    <div style="font-size: 14px; color: var(--text-muted); margin-top: 8px;">The page you are looking for does not exist.</div>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary" style="margin-top: 24px;"><i class="fas fa-home"></i> Go Home</a>
</div>
{% endblock %}
