{% extends "base.html" %}
{% block title %}Server Error{% endblock %}
{% block content %}
<div style="text-align: center; padding: 80px 20px;">
    <div style="font-size: 80px; font-weight: 800; background: linear-gradient(135deg, var(--danger), var(--warning)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">500</div>
    <div style="font-size: 24px; font-weight: 600; margin-top: 16px;">Server Error</div>
    <div style="font-size: 14px; color: var(--text-muted); margin-top: 8px;">Something went wrong. Please try again later.</div>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary" style="margin-top: 24px;"><i class="fas fa-home"></i> Go Home</a>
</div>
{% endblock %}
