{% extends "base.html" %}
{% block title %}Login - Smart Face Recognition Attendance{% endblock %}

{% block auth_content %}
<div class="login-page">
    <div class="login-bg-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    <div class="login-container">
        <div class="login-card fade-in">
            <div class="login-header">
                <div class="login-icon"><i class="fas fa-robot"></i></div>
                <div class="login-title">Welcome Back</div>
                <div class="login-subtitle">Sign in to Smart Face Recognition Attendance System</div>
            </div>
            <form method="POST" action="{{ url_for('auth.login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <div class="search-box">
                        <i class="fas fa-user"></i>
                        <input type="text" name="username" class="form-control" placeholder="Enter username" required autocomplete="username" style="padding-left: 40px;">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="search-box">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required autocomplete="current-password" style="padding-left: 40px;">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-top: 8px;">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
